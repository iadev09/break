[package]
name = "break"
version = "0.1.0"
edition = "2024"
autotests = false
description = "Find the HTTP load that breaks your SLA"
repository = "https://github.com/iadev09/break"
license = "MIT OR Apache-2.0"
keywords = ["http", "benchmark", "load-testing", "capacity"]
categories = ["command-line-utilities", "development-tools::profiling"]
exclude = ["AGENTS.local.md", ".cargo", ".cache", "rustfmt.toml", "*.local.sh"]

[workspace]

[lib]
name = "brk"

[[test]]
name = "http1"
path = "tests/http1.rs"

[[test]]
name = "tls"
path = "tests/tls.rs"
required-features = ["tls"]

[[bin]]
name = "brk"
path = "src/bin/brk.rs"
required-features = ["cli"]

[features]
default = ["cli", "tls"]
cli = ["dep:clap", "dep:ctrlc", "dep:humantime"]
# `https://` targets: HTTP/1.1 over TLS, with the same pipelining.
tls = ["dep:rustls", "dep:rustls-native-certs"]

[dependencies]
# HTTP/1 transport
bytes = "1"
http = "1"
httparse = "1"

# Optional TLS transport
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

# Executor and asynchronous operations
futures-util = "0.3"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"

# Optional command line
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3", optional = true }
humantime = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A throwaway certificate for the TLS fixture.
rcgen = "0.14"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = 0
panic = "unwind"
