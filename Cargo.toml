[package]
name = "break"
version = "0.2.2"
edition = "2024"
autotests = false
description = "Find the HTTP load that breaks your SLA"
repository = "https://github.com/iadev09/break"
license = "MIT OR Apache-2.0"
keywords = ["http", "benchmark", "load-testing", "capacity"]
categories = ["command-line-utilities", "development-tools::profiling"]
exclude = ["AGENTS.local.md", ".cargo", ".cache", "rustfmt.toml", "*.local.sh"]

[workspace]

[lib]
name = "brk"

[[test]]
name = "http1"
path = "tests/http1.rs"

[[test]]
name = "tls"
path = "tests/tls.rs"
required-features = ["tls"]

[[test]]
name = "connections"
path = "tests/connections.rs"

[[test]]
name = "http2"
path = "tests/http2.rs"
required-features = ["http2", "tls"]

[[bin]]
name = "brk"
path = "src/bin/brk.rs"
required-features = ["cli"]

[[bench]]
name = "client"
path = "benches/client.rs"
harness = false
required-features = ["cli", "http2"]

[features]
default = ["cli", "tls", "http2"]
cli = ["dep:clap", "dep:ctrlc", "dep:humantime"]
# `https://` targets: HTTP/1.1 over TLS, with the same pipelining.
tls = ["dep:rustls", "dep:rustls-native-certs"]
# `--http2`: the same tests over HTTP/2 streams.
http2 = ["dep:h2", "dep:fnv"]

[dependencies]
# HTTP/1 transport
bytes = "1"
http = "1"
httparse = "1"

# Optional HTTP/2 framing
h2 = { package = "h2-forked", version = "0.4.20", features = ["sans-io"], optional = true }

# Optional TLS transport
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"], optional = true }
rustls-native-certs = { version = "0.8", optional = true }

# Shared protocol readiness loop
mio = { version = "1", features = ["os-poll", "net"] }

# Phase coordination and test/benchmark responders
fnv = { version = "1", optional = true }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "io-util", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2"

# Optional command line
clap = { version = "4", features = ["derive"], optional = true }
ctrlc = { version = "3", optional = true }
humantime = { version = "2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A throwaway certificate for the TLS fixture.
rcgen = "0.14"
# The HTTP/2 fixture's TLS listener.
tokio-rustls = { version = "0.26", default-features = false }

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = 0
panic = "unwind"
